# Holt die Strompreise zweimal täglich und veröffentlicht die Seite auf GitHub Pages.
# Zeiten in UTC: 05:30 und 11:45 (= 07:30 / 13:45 Sommerzeit, 06:30 / 12:45 Winterzeit).
name: Strompreise aktualisieren

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "45 11 * * *"
  workflow_dispatch:
    inputs:
      verlauf_neu:
        description: "Ganzen Verlauf seit 2015 neu laden (dauert ca. 3 Minuten)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Verlauf zurücksetzen (nur auf Wunsch)
        if: github.event_name == 'workflow_dispatch' && inputs.verlauf_neu
        run: rm -f verlauf.json

      - name: Preise holen und Seite bauen
        shell: pwsh
        run: ./aktualisieren.ps1

      - name: Seite bereitstellen
        run: |
          mkdir -p _site
          cp strompreise.html _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5

      # Den ergänzten Verlauf speichern. Das tägliche Speichern hält zugleich den geplanten
      # Ablauf aktiv (GitHub pausiert ihn sonst nach 60 Tagen ohne Änderung).
      - name: Verlauf speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verlauf.json
          git commit -m "Verlauf bis $(date -u +%Y-%m-%d)" || exit 0
          git push
